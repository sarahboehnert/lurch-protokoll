name: PR Build Check

# Läuft bei jedem Pull Request, egal welcher Ziel-Branch (main, development, bugfix, ...)
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build -- --configuration production

# Damit ein fehlgeschlagener Build den Merge tatsächlich verhindert, muss dieser
# Job zusätzlich in den Branch Protection Rules (Settings > Branches) als
# "Required status check" für main, development und bugfix eingetragen werden.
