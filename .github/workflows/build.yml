name: Manuellen Build erstellen

# Manuell auslösbar über Actions-Tab. Baut die App zu einer angegebenen
# Versionsnummer und legt das Ergebnis als Pre-Release-Asset ab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z.B. 1.4.0)'
        required: true
        type: string

permissions:
  contents: write   # zum Anlegen von Tag + Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version in package.json setzen
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Tests
        run: npm test -- --no-watch --no-progress

      - name: Build
        run: npm run build -- --configuration production --base-href /Fahrstunden-Protokoll/

      - name: dist/ als ZIP packen
        run: |
          # Angulars "application"-Builder legt die index.html nicht direkt in dist/,
          # sondern in dist/<projektname>/browser/. Wir suchen den Ordner mit der
          # index.html automatisch, statt den Pfad hart zu codieren.
          BUILD_DIR=$(dirname "$(find dist -maxdepth 3 -name index.html | head -n 1)")
          if [ -z "$BUILD_DIR" ] || [ "$BUILD_DIR" = "." ]; then
            echo "Konnte keine index.html unter dist/ finden - Build-Struktur pruefen!"
            exit 1
          fi
          echo "Gefundener Build-Ordner: $BUILD_DIR"
          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/build-${{ inputs.version }}.zip" .

      - name: Test-Build als Pre-Release ablegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.version }}
          name: "Test-Build ${{ inputs.version }}"
          body: |
            Automatisch erstellter Test-Build, Version ${{ inputs.version }}.
            Branch/Commit: ${{ github.ref_name }} @ ${{ github.sha }}
          prerelease: true
          files: build-${{ inputs.version }}.zip
