name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review die Diff auf Korrektheit, Sicherheit und offensichtliche Bugs.
            Fokussiere dich auf Logikfehler, Edge Cases, fehlende Fehlerbehandlung, fehlende input validation und Tests die das
            neue Verhalten nicht testen. Achte dabei auf Angular Best Practices , Lesbarkeit, Wartbarkeit und unnötige Komplexität.
            Schreibe PR inline Kommentare auf Deutsch, wenn du zu bestimmten Zeilen etwas konkretes zu sagen hast und einen einzelnen
            Paragraphen als Zusammenfassung in einem Top-Level PR Kommentar.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
